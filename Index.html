<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wh2sAn - V2 Ultimate Hub</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;700;900&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">

    <style>
        /* --- CONFIGURACIÓN BASE Y CURSOR --- */
        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            /* Cursor OP */
            cursor: crosshair !important;
        }

        body {
            background-color: #030303;
            color: #ffffff;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            perspective: 1200px;
        }

        /* --- FONDO ANIMADO MATRIX / GRID 3D --- */
        .cyber-grid {
            position: fixed; top: -50%; left: -50%; width: 200vw; height: 200vh;
            background: 
                linear-gradient(rgba(217, 4, 41, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(217, 4, 41, 0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            transform: rotateX(60deg) translateZ(-200px);
            animation: gridScroll 5s linear infinite;
            z-index: -2; pointer-events: none;
        }
        @keyframes gridScroll {
            100% { transform: rotateX(60deg) translateZ(-200px) translateY(50px); }
        }

        .bg-glow {
            position: fixed; width: 100vw; height: 100vh;
            background: radial-gradient(circle at 50% 50%, rgba(217, 4, 41, 0.15) 0%, transparent 60%);
            z-index: -1; pointer-events: none;
            animation: pulseGlow 4s alternate infinite;
        }
        @keyframes pulseGlow {
            0% { transform: scale(0.9); opacity: 0.7; }
            100% { transform: scale(1.1); opacity: 1; }
        }

        /* --- CONTENEDOR PRINCIPAL (GLASSMORPHISM PANEL) --- */
        .container {
            width: 100%; max-width: 800px;
            background: rgba(10, 10, 10, 0.6);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(217, 4, 41, 0.2);
            border-radius: 24px;
            padding: 50px 30px;
            display: flex; flex-direction: column; align-items: center;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(217, 4, 41, 0.1);
            transform-style: preserve-3d;
            opacity: 0;
            /* Se eliminó el retraso de 1.5s en la animación 'appear' */
            animation: floatContainer 6s ease-in-out infinite, appear 1s forwards;
        }

        @keyframes appear { to { opacity: 1; } }
        @keyframes floatContainer {
            0%, 100% { transform: translateY(0) rotateX(2deg); }
            50% { transform: translateY(-15px) rotateX(-2deg); }
        }

        /* --- LOGO Y STATUS --- */
        .logo-section {
            display: flex; flex-direction: column; align-items: center; gap: 15px; margin-bottom: 30px;
            transform: translateZ(30px);
        }
        .logo-section img {
            width: 80px; height: 80px; border-radius: 20px;
            border: 3px solid #d90429;
            box-shadow: 0 0 30px #d90429;
        }
        
        .status-badge {
            background: rgba(16, 185, 129, 0.1); border: 1px solid #10b981;
            padding: 8px 20px; border-radius: 30px; font-weight: 700;
            display: flex; align-items: center; gap: 10px;
            text-shadow: 0 0 10px #10b981;
            transform: translateZ(40px);
        }
        .dot {
            width: 10px; height: 10px; background: #10b981; border-radius: 50%;
            box-shadow: 0 0 15px #10b981; animation: pulseGreen 1s infinite alternate;
        }
        @keyframes pulseGreen { to { transform: scale(1.5); opacity: 0.5; } }

        h1 {
            font-size: clamp(2.5rem, 6vw, 4rem); font-weight: 900;
            text-align: center; line-height: 1.1; margin-bottom: 20px;
            transform: translateZ(50px);
        }
        .highlight {
            color: #d90429; text-shadow: 0 0 20px rgba(217, 4, 41, 0.8);
            letter-spacing: 2px;
        }

        /* --- BOTONES 100% 3D FÍSICOS --- */
        .buttons-wrapper {
            width: 100%; max-width: 450px;
            display: flex; flex-direction: column; gap: 30px;
            margin-top: 20px; transform-style: preserve-3d;
        }

        .btn-3d {
            position: relative; width: 100%; border: none; background: transparent;
            outline: none; perspective: 1000px;
            text-decoration: none; display: block;
        }

        .btn-edge {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            border-radius: 16px;
            transition: all 0.2s cubic-bezier(0.3, 0.7, 0.4, 1.5);
        }

        .btn-front {
            position: relative;
            display: flex; justify-content: center; align-items: center; gap: 15px;
            padding: 22px; border-radius: 16px;
            font-size: 1.2rem; font-weight: 900; text-transform: uppercase; letter-spacing: 1px;
            color: white;
            transform: translateY(-12px) translateZ(20px);
            transition: transform 0.15s cubic-bezier(0.3, 0.7, 0.4, 1.5);
            pointer-events: none;
        }

        .btn-front i { font-size: 1.5rem; transform: translateZ(10px); }

        .btn-primary .btn-edge { background: #6b0010; box-shadow: 0 20px 30px rgba(217, 4, 41, 0.5); }
        .btn-primary .btn-front { background: linear-gradient(135deg, #ff1a40, #b3001e); border: 1px solid #ff4d66; }

        .btn-secondary .btn-edge { background: #0a0a0a; box-shadow: 0 20px 30px rgba(0, 0, 0, 0.8); }
        .btn-secondary .btn-front { background: linear-gradient(135deg, #222, #111); border: 1px solid #444; }
        .btn-3d:hover.btn-secondary .btn-front { border-color: #d90429; color: #d90429; }

        .btn-discord .btn-edge { background: #2c3477; box-shadow: 0 20px 30px rgba(88, 101, 242, 0.4); }
        .btn-discord .btn-front { background: linear-gradient(135deg, #6c78eb, #434eb0); border: 1px solid #8e98ff; }

        .btn-3d:active .btn-front {
            transform: translateY(-2px) translateZ(5px) !important;
            transition: transform 0.05s ease;
        }
        .btn-3d:active .btn-edge {
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.5);
        }

        /* --- CAJA DE CÓDIGO (ESTILO PANEL HOLOGRÁFICO) --- */
        .action-box {
            display: none; width: 100%; margin-top: -15px; margin-bottom: 20px;
            background: rgba(0, 0, 0, 0.9); border: 2px solid #d90429;
            border-radius: 0 0 16px 16px; padding: 25px 20px 20px;
            box-shadow: 0 20px 40px rgba(217, 4, 41, 0.2);
            transform-origin: top;
            animation: flipDown 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            position: relative;
        }

        @keyframes flipDown {
            from { opacity: 0; transform: rotateX(-90deg); }
            to { opacity: 1; transform: rotateX(0deg); }
        }

        .code-block {
            background: #050505; padding: 15px; border-radius: 8px;
            font-family: 'Fira Code', monospace; color: #00ffcc; font-size: 0.9rem;
            border: 1px solid #333; overflow-x: auto;
        }

        .copy-btn {
            background: #d90429; color: white; border: none; padding: 8px 15px;
            border-radius: 6px; font-weight: 700; cursor: pointer;
            margin-bottom: 10px; display: inline-flex; align-items: center; gap: 8px;
            transition: 0.2s;
        }
        .copy-btn:hover { background: #ff1a40; box-shadow: 0 0 15px #d90429; }
    </style>
</head>
<body>

    <div class="bg-glow"></div>
    <div class="cyber-grid"></div>

    <div class="container">
        <div class="logo-section">
            <img src="https://i.postimg.cc/j26bHbQk/IMG-20260711-WA0008.jpg" alt="Logo">
            <div class="status-badge"><span class="dot"></span> HUB ONLINE</div>
        </div>

        <h1>SYSTEM <span class="highlight">WH2SAN</span></h1>

        <div class="buttons-wrapper">
            
            <div style="width:100%; perspective: 1000px;">
                <button class="btn-3d btn-primary interactive-btn" onclick="toggleSection('script-box')">
                    <span class="btn-edge"></span>
                    <span class="btn-front"><i class="fa-solid fa-terminal"></i> Get Script</span>
                </button>
                
                <div id="script-box" class="action-box">
                    <button class="copy-btn" onclick="copyText('loadstring(game:HttpGet(\'https://raw.githubusercontent.com/progamera373-ui/Wh2s-hub-main-/refs/heads/main/Universal%20%20wh2s%20x%20hub\'))()', this, 'Copiar al Portapapeles')">
                        <i class="fa-regular fa-copy"></i> Copiar al Portapapeles
                    </button>
                    <div class="code-block">
                        loadstring(game:HttpGet("https://raw.githubusercontent.com/progamera373-ui/Wh2s-hub-main-/refs/heads/main/Universal%20%20wh2s%20x%20hub"))()
                    </div>
                </div>
            </div>

            <a href="https://www.keyforge.win/a/cms85mdmt1wn1tckvk769npr6" target="_blank" class="btn-3d btn-secondary interactive-btn">
                <span class="btn-edge"></span>
                <span class="btn-front"><i class="fa-solid fa-key"></i> Get Key</span>
            </a>

            <a href="https://discord.gg/5dnEPecWW" target="_blank" class="btn-3d btn-discord interactive-btn">
                <span class="btn-edge"></span>
                <span class="btn-front"><i class="fa-brands fa-discord"></i> Join Discord</span>
            </a>

        </div>
    </div>

    <script>
        // Función para abrir la caja del script
        function toggleSection(id) {
            const box = document.getElementById(id);
            if (box.style.display === "block") {
                box.style.display = "none";
            } else {
                box.style.animation = 'none';
                box.offsetHeight; /* Trigger reflow */
                box.style.animation = 'flipDown 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards'; 
                box.style.display = "block";
            }
        }

        // Función de copiado con confirmación
        function copyText(text, button, originalText) {
            navigator.clipboard.writeText(text).then(() => {
                button.innerHTML = '<i class="fa-solid fa-check"></i> ¡Copiado!';
                button.style.background = "#10b981";
                button.style.boxShadow = "0 0 15px #10b981";
                setTimeout(() => {
                    button.innerHTML = `<i class="fa-regular fa-copy"></i> ${originalText}`;
                    button.style.background = "";
                    button.style.boxShadow = "";
                }, 2000);
            });
        }

        // EFECTO HOLOGRÁFICO (El botón sigue al ratón en 3D)
        const interactiveBtns = document.querySelectorAll('.interactive-btn');
        
        interactiveBtns.forEach(btn => {
            const front = btn.querySelector('.btn-front');
            
            btn.addEventListener('mousemove', (e) => {
                const rect = btn.getBoundingClientRect();
                const x = e.clientX - rect.left; 
                const y = e.clientY - rect.top; 
                
                const centerX = rect.width / 2;
                const centerY = rect.height / 2;
                
                const rotateX = ((y - centerY) / centerY) * -15; 
                const rotateY = ((x - centerX) / centerX) * 15;
                
                front.style.transform = `translateY(-12px) translateZ(30px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
            });
            
            btn.addEventListener('mouseleave', () => {
                front.style.transform = `translateY(-12px) translateZ(20px) rotateX(0deg) rotateY(0deg)`;
            });
        });
    </script>
</body>
</html>
